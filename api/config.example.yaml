# 复制为 config.yaml，填写已有 MySQL 中的博客专用账号密码。
server:
  port: 6324
  # 开发模式默认开放文档；生产模式仅在此项为 true 时开放。
  swagger_enabled: false
mysql:
  host: 127.0.0.1
  port: 3306
  database: kakozane_blog
  user: kakozane_blog_app
  password: "请填写博客专用账号密码"
redis:
  address: 127.0.0.1:6379
  # 生产 Redis 已启用认证，填写对应密码；本地无密码可留空。
  password: ""
media:
  directory: uploads
auth:
  # 精确配对来源；仅支持同站 HTTPS 域名。开发和生产使用各自的配对。
  # 部署线上时替换为 https://retniw.cc 与 https://admin.retniw.cc。
  sso_sites:
    - front_origin: https://dev.retniw.cc
      admin_origin: https://admin.dev.retniw.cc
    - front_origin: https://localhost:6325
      admin_origin: https://localhost:6326
