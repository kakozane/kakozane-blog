basePath: /api/v1
definitions:
  handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  model.Post:
    properties:
      authorId:
        type: integer
      authorName:
        type: string
      categoryId:
        type: integer
      categoryName:
        type: string
      categorySlug:
        type: string
      contentMd:
        type: string
      coverUrl:
        type: string
      createdAt:
        type: string
      excerpt:
        type: string
      id:
        type: integer
      kind:
        type: string
      pinned:
        type: boolean
      publishedAt:
        type: string
      slug:
        type: string
      status:
        type: string
      tags:
        items:
          $ref: '#/definitions/model.Term'
        type: array
      title:
        type: string
      updatedAt:
        type: string
      version:
        type: integer
    type: object
  model.PostInput:
    properties:
      categoryId:
        type: integer
      contentMd:
        type: string
      coverUrl:
        type: string
      excerpt:
        type: string
      kind:
        type: string
      pinned:
        type: boolean
      slug:
        type: string
      status:
        type: string
      tagIds:
        items:
          type: integer
        type: array
      title:
        type: string
      version:
        type: integer
    type: object
  model.Revision:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      snapshot:
        $ref: '#/definitions/model.PostInput'
    type: object
  model.Term:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  model.WritingDraft:
    properties:
      key:
        type: string
      snapshot:
        $ref: '#/definitions/model.PostInput'
      updatedAt:
        type: string
      version:
        type: integer
    type: object
info:
  contact: {}
  description: 博客 API。登录使用同源 HTTPS HttpOnly Cookie，前台和后台会话独立。先调用对应登录接口，再使用 Try it
    out；不使用 Bearer Token。当前文档覆盖健康检查、登录会话、文章及写作工作流。
  title: Kakozane Blog API
  version: "1.0"
paths:
  /admin/auth/login:
    post:
      consumes:
      - application/json
      description: Cookie 由浏览器自动管理；写操作必须通过同源 HTTPS 发起。
      parameters:
      - description: 账号密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user 信息；仅后台包含 role、permissions
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "426":
          description: Upgrade Required
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 后台认证 - Login
      tags:
      - 后台认证
  /admin/auth/logout:
