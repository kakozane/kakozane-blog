name: Build and deploy blog
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '构建后部署到生产服务器'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: blog-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Go tests and Swagger consistency
        working-directory: api
        run: |
          go generate ./cmd/server
          git diff --exit-code -- docs
          go test ./...
  build:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: blog-api
            context: ./api
            file: ./api/Dockerfile
          - image: blog-web
            context: ./web
            file: ./web/Dockerfile
          - image: blog-proxy
            context: .
            file: ./Dockerfile.proxy
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          # ACR 个人版不接受 BuildKit 默认附带的 OCI attestation manifest。
          provenance: false
          sbom: false
          tags: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  deploy:
    needs: build
    # 首次上线完成后开启 ENABLE_AUTO_DEPLOY；也可手动选择 deploy。
    if: github.ref == 'refs/heads/main' && (vars.ENABLE_AUTO_DEPLOY == 'true' || inputs.deploy == true)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy exact commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$target" "mkdir -p /opt/blog/releases/$RELEASE_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" deploy/compose.yaml deploy/Caddyfile deploy/release.sh "$target:/opt/blog/releases/$RELEASE_SHA/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$target" "bash /opt/blog/releases/$RELEASE_SHA/release.sh $RELEASE_SHA"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
